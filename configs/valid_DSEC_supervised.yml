experiment: Default


loader:
    batch_size: 1
    resolution: [480, 640] # H x W origin resolution
    scale_factor: 1
    crop: [288,384]
    gpu: 0
#    remap: "v1"


model:
    norm_input: "minmax"

#swin_transformer:
#    use_arc: [Null,Null]
#    window_size: [ 2,15,15 ]
#    pretrained_window_size: [2,9,9]



loss:
    lambda_mod: 1
    lambda_ang: 0

metrics:
    name: [AEE,AAE]  # FWL, RSAT, AEE
    mask_events: False


vis:
    verbose: False
    # False: cv2.imshow/namedWindow in Visualization_DSEC.update() need a real X display and
    # will crash (or abort the whole process under Qt) on a headless Slurm compute node. Has no
    # effect on the AEE/AAE metrics computed below -- those never touch chunk_vis/flow_vis/vis.
    enabled: False
    px: 400
    store: False
    # Must be present, not just commented out: eval_DSEC_flow_SNN.py reads
    # config["vis"]["store_att"] via `enabled or store_att or ...`, which raises KeyError the
    # moment `enabled` is False and Python's `or` no longer short-circuits before reaching it.
    store_att: False
    monitor_fr: False
    monitor_v: False




test:
    scale_factor: 1
    sample: 40

